<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64px" height="64px" viewBox="0 0 64 64" version="1.1">
  <defs>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71b2f8"/>
      <stop offset="1" stop-color="#002795"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cfe3ff" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- isometric GDML box -->
  <g stroke="#001a4d" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="10,22 28,13 46,22 28,31" fill="#9cc7fb"/>
    <polygon points="10,22 28,31 28,53 10,44" fill="url(#boxLeft)"/>
    <polygon points="46,22 28,31 28,53 46,44" fill="#0b3aa0"/>
  </g>

  <!-- magnifying glass analysing the shape -->
  <g stroke="#263238" stroke-width="3.2" stroke-linecap="round">
    <circle cx="41" cy="39" r="13" fill="url(#lens)"/>
    <line x1="50.5" y1="48.5" x2="59" y2="57"/>
  </g>
</svg>
