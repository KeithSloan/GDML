<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px"
     viewBox="0 0 64 64" version="1.1">
  <defs>
    <linearGradient id="matLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7a9e7"/>
      <stop offset="1" stop-color="#a94ea9"/>
    </linearGradient>
  </defs>

  <!-- isometric material box (echoes Set Material, mauve) -->
  <g stroke="#2b1030" stroke-width="2.4" stroke-linejoin="round">
    <polygon points="8,22 26,12 44,22 26,32" fill="#f0c4f0"/>
    <polygon points="8,22 26,32 26,54 8,44" fill="url(#matLeft)"/>
    <polygon points="44,22 26,32 26,54 44,44" fill="#8f3d8f"/>
  </g>
  <!-- material 'content' dots -->
  <g fill="#5a2d12">
    <ellipse cx="26" cy="21" rx="4.2" ry="2.4"/>
    <ellipse cx="17" cy="37" rx="3.2" ry="4.6"/>
    <ellipse cx="35" cy="37" rx="3.2" ry="4.6"/>
  </g>

  <!-- green 'add' badge -->
  <g>
    <circle cx="49" cy="16" r="12" fill="#2ea043" stroke="#12481f"
            stroke-width="2.2"/>
    <path d="M49 9.5 V22.5 M42.5 16 H55.5" stroke="#ffffff"
          stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
